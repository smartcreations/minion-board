<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="minion-board-version" content="1.3.4">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minion Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one column per project, most urgent project first; cards sorted by urgency; status drives color, icon and motion. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#16181d; --muted:#5f6672; --line:#e2e4de; --accent:#2350e6;
  --brainstorm:#6d5bd0; --brainstorm-bg:#f0edff;
  --working:#e07a00;    --working-bg:#fff3e3;
  --approval:#e0217a;   --approval-bg:#ffe8f2;
  --idea:#c99700;       --idea-bg:#fff8d6;
  --error:#d42a20;      --error-bg:#ffe9e7;
  --success:#1f9d4c;    --success-bg:#e4f7ea;
  --idle:#7a808a;       --idle-bg:#eff0ee;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1a1d22; --ink:#eceef1; --muted:#9aa1ad; --line:#2a2e35; --accent:#7d9bff;
  --brainstorm:#a99bff; --brainstorm-bg:#221d3a; --working:#ffa23a; --working-bg:#2e2212;
  --approval:#ff5fa8; --approval-bg:#36152a; --idea:#ffd23f; --idea-bg:#302a10;
  --error:#ff6b61; --error-bg:#361816; --success:#4fd683; --success-bg:#132c1d; --idle:#9aa1ad; --idle-bg:#22262c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1a1d22; --ink:#eceef1; --muted:#9aa1ad; --line:#2a2e35; --accent:#7d9bff;
  --brainstorm:#a99bff; --brainstorm-bg:#221d3a; --working:#ffa23a; --working-bg:#2e2212;
  --approval:#ff5fa8; --approval-bg:#36152a; --idea:#ffd23f; --idea-bg:#302a10;
  --error:#ff6b61; --error-bg:#361816; --success:#4fd683; --success-bg:#132c1d; --idle:#9aa1ad; --idle-bg:#22262c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding:12px 16px 40px}
.wrap{max-width:2600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px 3px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.lg b{font:500 12px var(--mono);color:var(--c)}
.lg.zero{opacity:.45}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.live i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.live.on i{background:var(--success)}
.live.on i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--success);animation:radar 1.8s ease-out infinite}
.live.err i{background:var(--error)}
@keyframes radar{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}

.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h2{margin:0;font:600 13px var(--body);display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.col h2 .n{font:500 12px var(--mono);color:var(--muted)}
.col h2 .dots{margin-left:auto;display:flex;gap:3px}
.col h2 .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}

.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:9px 12px 10px;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:0 10px 10px 0;
  font:inherit;color:inherit;text-decoration:none;text-align:left;cursor:pointer;width:100%;margin:0;appearance:none;transition:border-color .15s}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;color:var(--c);background:var(--cbg);padding:2px 8px 2px 6px;border-radius:999px}
.ic{display:inline-block;font-size:13px;line-height:1}
.tag{white-space:nowrap;font:500 11px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.age{margin-left:auto;font:12px var(--mono);font-variant-numeric:tabular-nums}
.title{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.tag.new{color:#fff;background:var(--success);border-color:var(--success)}
.who{display:inline-block;font:500 11px var(--mono);color:var(--c);background:var(--cbg);border-radius:5px;padding:0 6px;margin-right:7px;vertical-align:1px}
.next{font-size:13px;background:var(--cbg);border-radius:7px;padding:6px 9px;overflow-wrap:anywhere}
.run{font:500 12px var(--mono);color:var(--working)}
.stale{font:500 12px var(--mono);color:var(--error)}

/* status motion */
.s-working .ic{animation:spin 2.4s linear infinite}
.s-working::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--working),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{background-position:-40% 0}100%{background-position:140% 0}}
.s-approval{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--approval) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.s-approval .ic{animation:wave 1.6s ease-in-out infinite;transform-origin:70% 80%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(12deg)}}
.s-idea .ic{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 5px var(--idea))}}
.s-error{background:linear-gradient(var(--error-bg),var(--error-bg)) padding-box}
.s-error .ic{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.s-brainstorm .ic{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-2px)}}
.s-success.fresh{background:linear-gradient(120deg,var(--success-bg),var(--surface) 70%)}
.fresh{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),0 4px 14px color-mix(in srgb,var(--c) 22%,transparent)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.confetti{position:absolute;pointer-events:none;width:7px;height:10px;border-radius:2px;top:18px;left:30px;animation:pop 1.3s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){
  .live.on i::after,.s-working .ic,.s-working::after,.s-approval,.s-approval .ic,.s-idea .ic,.s-error .ic,.s-brainstorm .ic,.flash,.shake{animation:none}
  .confetti{display:none}}

details.done{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
details.done summary{cursor:pointer;font-weight:600;font-size:13px}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.drow:first-of-type{border-top:0}
.drow .t{flex:1;min-width:160px}
.note{font-size:13px;color:var(--muted)}
.btn{all:unset;cursor:pointer;font-size:12px;font-weight:500;padding:4px 10px;border-radius:7px;border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent)}
.banner{background:var(--working-bg);border-radius:10px;padding:10px 14px;font-size:13px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:sticky;bottom:12px;align-self:center;background:var(--ink);color:var(--surface);font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.repbtn{display:none}
body.immersive{overflow:hidden;padding:0}
body.immersive .bar,body.immersive #banner,body.immersive .plegend{display:none}
body.immersive .stage{position:fixed;inset:0;z-index:40;border-radius:0}
body.immersive .zoom{top:max(10px, env(safe-area-inset-top));right:10px}
.reports .x{display:none}
.reports.min .rp,.reports.min>div:not(.hd){display:none}
.reports{max-height:calc(100% - 20px);overflow:auto}
@media (max-width:700px){
  body{padding:8px 10px 24px}
  .wrap{gap:8px}
  .bar{gap:6px}
  .legend{order:5;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .legend::-webkit-scrollbar{display:none}
  .lg{flex:none;font-size:11.5px;padding:2px 8px 2px 6px}
  .snd{padding:4px 9px}
  .snd .t,#liveText{display:none}
  .live{padding:7px 9px}
  .seg button{padding:4px 10px}
  .zoom{top:6px;right:6px;gap:3px}
  .zoom button{min-width:26px;height:26px;padding:0 6px;font-size:12px}
  .zoom .t{display:none}
  .repbtn{all:unset;position:absolute;top:6px;left:6px;z-index:2;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:#e0217a;color:#fff;font:600 13px var(--body);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .repbtn[hidden]{display:none}
  .reports{display:none}
  .reports.open{display:block;position:fixed;inset:0;width:auto;max-width:none;max-height:none;border-radius:0;z-index:50;padding:18px 14px 30px;font-size:15px;background:rgba(14,17,26,.97)}
  .reports.open .hd{font-size:17px;padding:4px 4px 12px;position:sticky;top:-18px;background:rgba(14,17,26,.97)}
  .reports.open .hd button{font-size:13px}
  .reports.open .x{display:inline-block;margin-left:6px;font-size:18px;padding:2px 10px}
  .reports.open .rp{padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0}
  .reports.open .rp .tt{white-space:normal}
  .reports.open .rp .sm{-webkit-line-clamp:4}
  .plegend{gap:4px 8px}
  .plegend .hint{display:none}
  .pop{width:calc(100% - 16px);left:8px!important}
}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:13px;padding:4px 12px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible,.snd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.snd{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.snd[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#1d2433;display:flex;justify-content:center}
.stage canvas{display:block;image-rendering:pixelated;cursor:default;touch-action:none;-webkit-user-select:none;user-select:none}
.pop{position:absolute;width:280px;z-index:2;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
#fsBack{all:unset;position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px, env(safe-area-inset-bottom));z-index:3;cursor:pointer;background:#fff;color:#1d2433;border:3px solid #1d2433;border-radius:4px;box-shadow:0 3px 0 #1d2433;padding:8px 14px;font:600 14px "IBM Plex Sans",system-ui,sans-serif}
#fsBack[hidden]{display:none}
.evmenu{position:absolute;top:44px;right:10px;z-index:4;display:flex;flex-direction:column;gap:6px;padding:8px;background:#fff;border:3px solid #1d2433;border-radius:4px;box-shadow:0 3px 0 #1d2433}
.evmenu[hidden]{display:none}
.evmenu button{all:unset;cursor:pointer;padding:6px 10px;border:2px solid #1d2433;border-radius:3px;font:600 13px "IBM Plex Sans",system-ui,sans-serif;color:#1d2433;background:#fff;box-shadow:0 2px 0 #1d2433}
.evmenu button:hover{background:#fff3c4}
.rchoice{background:#fff;color:#1d2433;border:3px solid #1d2433;border-radius:4px;padding:10px 12px 12px;box-shadow:inset 0 -3px 0 #dfe4ec;font:14px/1.35 "IBM Plex Sans",system-ui,sans-serif;width:260px}
.rchoice .rcp{display:flex;align-items:center;gap:6px;font:600 12px "IBM Plex Sans",system-ui,sans-serif;margin-bottom:3px;text-transform:none}
.rchoice .rcp i{width:9px;height:9px;border-radius:2px;border:1.5px solid #1d2433;display:inline-block}
.rchoice .rct{font-size:13px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchoice .rcs{font-size:14px;margin-bottom:10px}
.rchoice .rcb{display:flex;gap:8px}
.rcbtn{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 0;border:2px solid #1d2433;border-radius:3px;font:600 13px "IBM Plex Sans",system-ui,sans-serif;box-shadow:0 2px 0 #1d2433}
.rcbtn.go{background:#7cc242;color:#14300a}
.rcbtn.dis{background:#fff;color:#1d2433}
.rcbtn:active{transform:translateY(2px);box-shadow:none}
.retire{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:8px 10px;background:#fff;color:#1d2433;border:2px solid #1d2433;border-radius:4px;font:13px "IBM Plex Sans",system-ui,sans-serif}
.retire button{all:unset;cursor:pointer;padding:4px 10px;border:2px solid #1d2433;border-radius:3px;font-weight:600;box-shadow:0 2px 0 #1d2433;background:#ffd6d6}
.pop .card{border-radius:0 10px 10px 0}
.pop .pcard .card{border-radius:0 10px 0 0}
.pact{display:flex;gap:6px;padding:8px 12px 10px;background:var(--surface);border:1px solid var(--line);border-top:1px dashed var(--line);border-left:4px solid var(--c);border-radius:0 0 10px 0}
.pact button{all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:6px;font:600 12px var(--body);color:inherit;white-space:nowrap}
.pact button:hover{border-color:var(--muted)}
.pact button.ret{flex:0 0 auto;padding:6px 10px}
.zoom{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:1}
.zoom button{all:unset;cursor:pointer;min-width:28px;height:28px;line-height:28px;padding:0 9px;text-align:center;border-radius:8px;background:rgba(20,24,34,.68);color:#fff;font:600 13px var(--body);backdrop-filter:blur(4px)}
.zoom select{all:unset;cursor:pointer;height:28px;line-height:28px;padding:0 9px;border-radius:8px;background:rgba(20,24,34,.68);color:#fff;font:600 13px/28px var(--body);backdrop-filter:blur(4px)}
.zoom select option{color:#111}
.zoom button:hover,.zoom select:hover{background:rgba(20,24,34,.85)}
.zoom button:focus-visible{outline:2px solid #fff}
.reports{position:absolute;top:10px;left:10px;width:300px;max-width:calc(100% - 20px);z-index:1;background:rgba(18,22,32,.9);color:#fff;border-radius:12px;padding:8px;font-size:12.5px;backdrop-filter:blur(4px)}
.reports .hd{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-weight:600}
.reports .hd button{all:unset;cursor:pointer;margin-left:auto;font-size:11.5px;font-weight:500;color:#b9c3d6;padding:2px 6px;border-radius:6px}
.reports .hd button:hover{color:#fff;background:rgba(255,255,255,.1)}
.rp{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-radius:8px;color:#fff;text-decoration:none;cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit}
.rp:hover{background:rgba(255,255,255,.08)}
.rp .ok{flex:none;font-size:13px;line-height:18px}
.rp .bd{min-width:0;flex:1}
.rp .tt{font-weight:600;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp .nm{font:600 10.5px var(--mono);color:var(--c);margin-right:5px}
.rp .sm{color:#c9d2e3;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rp .ag{flex:none;color:#8f9bb3;font:11px var(--mono);line-height:18px}
.plegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 2px 0}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.pl{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.pl:hover{border-color:var(--line)}
.pl[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:var(--surface);font-weight:600}
.pl:focus-visible{outline:2px solid var(--accent)}
.plegend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="mBoard" aria-pressed="true">Board</button>
      <button id="mWorld" aria-pressed="false">World</button>
    </div>
    <div class="legend" id="legend" aria-label="Status counts"></div>
    <button class="snd" id="snd" aria-pressed="false" title="Sound effects" hidden>🔇 Sound off</button>
    <div class="live" id="live" role="status"><i></i><span id="liveText">Connecting…</span></div>
  </div>
  <div id="banner"></div>
  <div id="boardView">
    <div class="cols" id="cols"></div>
    <details class="done" id="done"><summary id="doneSum">Done</summary><div id="doneList"></div></details>
  </div>
  <div id="worldView" hidden>
    <div class="stage" id="stage">
      <div id="evMenu" class="evmenu" hidden><button data-ev="random">🎲 Surprise me</button><button data-ev="quake">🌋 Earthquake</button><button data-ev="macarena">💃 Macarena</button><button data-ev="revolt">✊ Revolution</button><button data-ev="stampede">🐘 Stampede</button>
</div>
      <button id="fsBack" hidden>⛶ Back to full screen</button>
      <canvas id="world" aria-label="Isometric office where each helper is one of your Claude threads"></canvas>
      <div class="pop" id="pop" hidden></div>
      <div class="reports" id="reports" hidden></div>
      <div class="zoom" role="group" aria-label="Zoom"><button id="zMe" title="Zoom to your office" aria-label="Zoom to your office">✋<span class="t"> My office</span></button><button id="zEv" title="City events" aria-label="City events">🎲<span class="t"> Events</span></button><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit">⤢<span class="t"> Fit</span></button><button id="zFull" title="Full screen" aria-label="Full screen">⛶</button><select id="decor" aria-label="Scenery"><option value="floating">☁️ Floating</option><option value="city">🏙️ City</option><option value="academy">🏰 Academy</option></select><button id="zLight" title="Lighting follows the time of day">🌗<span class="t"> Auto</span></button></div>
      <button class="repbtn" id="repBtn" hidden aria-label="Open reports">📬 <b id="repN">0</b></button>
    </div>
    <div class="plegend" id="plegend"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
const STATUS = {
  error:     {label:"Error",          icon:"🚨", rank:0},
  approval:  {label:"Needs you", icon:"✋", rank:1},
  idea:      {label:"Has an idea",    icon:"💡", rank:2},
  success:   {label:"Ready to review", icon:"👀", rank:3},
  working:   {label:"Working",        icon:"⚙️", rank:4},
  brainstorm:{label:"Brainstorming",  icon:"💭", rank:5},
  idle:      {label:"Idle",           icon:"💤", rank:6}
};
const ALIAS = {waiting:"approval", responding:"approval", review:"success"};
const NAMES = ["Pip","Nubs","Zibbo","Toffee","Gizmo","Bean","Waffle","Pickle","Sprocket","Mochi","Bloop","Tater","Noodle","Biscuit","Ziggy","Wobble","Puddle","Chip","Fizz","Momo","Dot","Bolt","Jelly","Pogo","Tofu","Nacho","Pebble","Sprout","Zuzu","Fig","Bonk","Kiki","Yoyo","Dumpling","Muffin","Rivet","Scoot","Tinker","Widget","Nugget","Boop","Taco","Cosmo","Pixel","Squish","Gumbo","Marbles","Turbo","Olive","Peanut","Sushi","Clove","Bubbles","Ranger","Echo","Juno","Rusty","Sparky","Doodle","Mango"];
let NAME_OF = new Map();
let SEEN = {};
try { SEEN = JSON.parse(localStorage.getItem("sb-seen") || "{}") || {}; } catch(e) { SEEN = {}; }
const UNREAD_HOURS = 4;
function isUnread(r){
  if (!r || r.status === "done" || r.status === "working" || r.changedBy === "board") return false;
  const k = typeof eff === "function" ? eff(r) : r.status;
  if (!["idle","success","brainstorm","idea"].includes(k)) return false;
  const t = Date.parse(r.updatedAt); if (isNaN(t) || Date.now() - t > UNREAD_HOURS*3600e3) return false;
  return !(SEEN[r.id] && SEEN[r.id] >= t);
}
function markSeen(ids){
  const now = Date.now();
  for (const id of [].concat(ids)) { const r = (typeof rows !== "undefined" ? rows : []).find(x => x.id === id); SEEN[id] = Math.max(now, (r && Date.parse(r.updatedAt)) || 0) + 1000; }
  for (const k of Object.keys(SEEN)) if (now - SEEN[k] > 7*86400e3) delete SEEN[k];
  try { localStorage.setItem("sb-seen", JSON.stringify(SEEN)); } catch(e) {}
  // also keep read state in the board's data, so it survives storage resets and follows you across devices
  try { if (typeof db !== "undefined" && db) db.collection("seen").doc("all").set({ids: SEEN, at: new Date().toISOString()}).catch(() => {}); } catch(e) {}
  if (typeof render === "function") render();

function nameHash(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function assignNames(list){
  const used = new Set(), out = new Map();
  for (const r of list) if (r.name) { out.set(r.id, String(r.name)); used.add(String(r.name)); }
  for (const r of [...list].sort((a,b) => a.id < b.id ? -1 : 1)) {
    if (out.has(r.id)) continue;
    let i = nameHash(r.id) % NAMES.length, k = 0;
    while (used.has(NAMES[i]) && k++ < NAMES.length) i = (i + 1) % NAMES.length;
    const n = used.has(NAMES[i]) ? NAMES[i] + " " + (nameHash(r.id) % 90 + 10) : NAMES[i];
    out.set(r.id, n); used.add(n);
  }

}
const nameOf = r => NAME_OF.get(r.id) || NAMES[nameHash(r.id) % NAMES.length];
// threads go quiet or get deleted, and nothing tells the board: an idle card untouched for a week dozes off and leaves.
// It comes back the moment its thread writes again.
const STALE_DAYS = 7;
const isStale = r => !!r && (r.status === "idle" || r.status === "brainstorm") && !(typeof isUnread === "function" && isUnread(r)) && (Date.now() - Date.parse(r.updatedAt || 0)) > STALE_DAYS*86400000;
const SURF = {chat:"Chat", cowork:"Cowork", code:"Code"};
const QUIET_MIN = 4, FRESH_MIN = 2;
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let rows = [], connected = false, firstPaint = true, rowsReady = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const st = r => { const s = ALIAS[r.status] || r.status; return STATUS[s] ? s : "idle"; };
const PENDING_SEC = 20;
const pendingStale = r => st(r) === "working" && r.pendingApproval && (mins(r.pendingSince || r.updatedAt) || 0) * 60 > PENDING_SEC;
const eff = r => (st(r) === "working" && (mins(r.updatedAt) > QUIET_MIN || pendingStale(r))) ? "approval" : st(r);

let projectLinks = new Map();

  const proj = own ? "" : (projectLinks.get(r.project || "") || "");
  const web = own || proj;

}

function card(r){
  const s = st(r), S = STATUS[s];

  const pend = pendingStale(r);
  const quiet = s === "working" && (mins(r.updatedAt) > QUIET_MIN || pend);
  const {href, viaProject} = linkFor(r);

    ? `<a ${attrs} href="${esc(href)}"${IS_MOBILE ? "" : ` target="_blank" rel="noopener"`} title="${viaProject ? "Opens the project (no thread link yet)" : "Open thread"}">`
    : `<button type="button" ${attrs} data-copy="${esc(r.ccSession ? "claude --resume " + r.ccSession : (r.title||""))}" title="${r.ccSession ? "Copy the resume command" : "Copy title"}">`;
  h += `<div class="top"><span class="pill"><span class="ic" aria-hidden="true">${quiet ? "✋" : S.icon}</span>${pend ? "Needs your OK" : quiet ? "Check on it" : S.label}</span>
    ${r.surface ? `<span class="tag">${esc(SURF[r.surface] || r.surface)}</span>` : ""}
    ${viaProject ? `<span class="tag">via project</span>` : ""}

function draw(){
  assignNames(rows);
  projectLinks = new Map();
  for (const r of rows) {
    const m = /^(https:\/\/claude\.ai\/code\/project\/chan_[A-Za-z0-9]+)/.exec(r.link || "");
    if (m && !projectLinks.has(r.project || "")) projectLinks.set(r.project || "", m[1]);

      <h2>${esc(c.p)} <span class="n">${c.arr.length}</span><span class="dots" aria-hidden="true">${c.arr.filter(r=>eff(r)!=="idle").slice(0,8).map(r=>`<i style="--c:var(--${eff(r)})"></i>`).join("")}</span></h2>

  $("doneSum").textContent = `Done (${done.length})`;
  $("doneList").innerHTML = done.length ? done.map(r => `<div class="drow"><span class="t"><b>${esc(r.project||"")}</b> · ${esc(r.title||r.id)}</span>
    <span class="note">${esc(ago(r.updatedAt))} ago</span><button class="btn" data-del="${esc(r.id)}">Remove</button></div>`).join("") : `<p class="note">Nothing finished yet.</p>`;
}

function confetti(el){

function render(){

let db = null;
document.addEventListener("click", e => { const c = e.target.closest("[data-cid]"); if (c && c.dataset.cid) markSeen(c.dataset.cid); }, true);

  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy !== undefined) { navigator.clipboard?.writeText(b.dataset.copy).then(()=>toast("Title copied. Search for it in Claude."), ()=>toast("Copy blocked here.")); return; }

});

function setLive(cls, text){ const l=$("live"); l.className="live "+cls; $("liveText").textContent=text; }
const clock = () => new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});

render();
setInterval(() => { render(); if (connected) setLive("on","Live · "+clock()); }, 10000);

(async () => {
  const timer = setTimeout(() => setLive("err","Can't reach data yet"), 10000);
  try { db = await window.claude?.use?.("db"); } catch(e) { db = null; }
  if (!db) { clearTimeout(timer); setLive("err","Offline"); $("banner").innerHTML = `<div class="banner">Board data isn't available in this view. Open the board on claude.ai while signed in.</div>`; return; }
  db.collection("sessions").onSnapshot(snap => {
    rows = snap.docs.map(d => ({id:d.id, ...d.data()})); rowsReady = true;
    if (!snap.metadata.fromCache) { clearTimeout(timer); connected = true; }
    setLive(connected ? "on" : "", connected ? "Live · "+clock() : "Loading…");
    render();
  }, () => { clearTimeout(timer); setLive("err","Disconnected"); $("banner").innerHTML = `<div class="banner">The live connection stopped. Reload the page to reconnect.</div>`; });

    let ch = false;
    for (const d of snap.docs) { const v = (d.data() || {}).ids || {}; for (const k in v) if (typeof v[k] === "number" && !(SEEN[k] >= v[k])) { SEEN[k] = v[k]; ch = true; } }
    if (ch) { try { localStorage.setItem("sb-seen", JSON.stringify(SEEN)); } catch(e) {} lastRep = ""; render(); }
  }, () => {});
  // Claude Code hooks drop small event notes in "signals"; the open board applies them to the cards.
  let sigFirst = true;
  db.collection("signals").onSnapshot(snap => {
    if (sigFirst) { sigFirst = false;
      // old hook events are dropped; a thread's "go" note from the last 15 minutes still counts (the turn may still be running)
      snap.docs.forEach(d => { const v = d.data() || {}; if (v.card && v.at && (Date.now() - Date.parse(v.at)) < 3*60000) setTimeout(() => applySignal(d.id, v), 2500); else db.collection("signals").doc(d.id).delete().catch(() => {}); });

})();
const busySig = new Set();
// A thread's first call of a turn: a write-only note (no read needed), so the card flips to Working right away.
async function applyCardSignal(s){
  for (let i = 0; !rowsReady && i < 40; i++) await new Promise(r => setTimeout(r, 250));   // never judge a note against cards we haven't loaded yet

    if (s.link && /^https:\/\/claude\.ai\//.test(s.link)) doc.link = String(s.link);

  }
}
async function applySignal(id, s){
  if (busySig.has(id)) return; busySig.add(id);
  try {
    if (s.card) { try { await applyCardSignal(s); } catch(e) {} try { await db.collection("signals").doc(id).delete(); } catch(e) {} busySig.delete(id); return; }
    const sid = String(s.session || ""); if (!/^[A-Za-z0-9-]+$/.test(sid)) return;
    const card = rows.find(r => r.ccSession === sid || r.id === "cc-" + sid);
    const now = new Date().toISOString(), ev = s.event;
    let patch = null;
    if (ev === "prompt") patch = {status:"working", startedAt:now, progress:"on it", next:null, pendingApproval:false};
    else if (ev === "perm") patch = {pendingApproval:true, pendingSince:new Date(Date.now() - 60000).toISOString(), pendingStep:"a permission prompt", ...(card && card.status !== "working" ? {status:"working"} : {})};
    else if (ev === "stop") patch = card ? (card.status === "working" ? {status:"idle", progress:null, pendingApproval:false} : (card.pendingApproval ? {pendingApproval:false} : null)) : null;
    else if (ev === "end") patch = card ? {status:"done", progress:null, pendingApproval:false} : null;
    if (patch) {
      patch.updatedAt = now; patch.changedBy = "hook"; patch.ccSession = sid;
      if (card) await db.collection("sessions").doc(card.id).update(patch);
      else {
        const cwd = String(s.cwd || ""), base = cwd.split("/").filter(Boolean).pop() || "Claude Code";
        await db.collection("sessions").doc("cc-" + sid).set({project: base, title: base + " session", surface: "code", cwd, ...patch});
      }
    }
  } catch(e) {}
  try { await db.collection("signals").doc(id).delete(); } catch(e) {}
  busySig.delete(id);
}

<script>
(() => {
/* ---------- mode toggle ---------- */
const boardView = document.getElementById("boardView"), worldView = document.getElementById("worldView");
const mBoard = document.getElementById("mBoard"), mWorld = document.getElementById("mWorld"), snd = document.getElementById("snd");
let mode = "board";
try { if (location.hash === "#world" || localStorage.getItem("sb-mode") === "world") mode = "world"; } catch(e) {}
function setMode(m){
  mode = m;
  boardView.hidden = m !== "board"; worldView.hidden = m !== "world"; snd.hidden = m !== "world";
  mBoard.setAttribute("aria-pressed", m === "board"); mWorld.setAttribute("aria-pressed", m === "world");
  try { localStorage.setItem("sb-mode", m); history.replaceState(null, "", m === "world" ? "#world" : location.pathname + location.search); } catch(e) {}
  if (m === "world") { resize(); }
}
mBoard.onclick = () => setMode("board");
mWorld.onclick = () => setMode("world");

/* ---------- sound ---------- */
let AC = null, soundOn = false;
try { soundOn = localStorage.getItem("sb-sound") === "on"; } catch(e) {}
function syncSnd(){ snd.setAttribute("aria-pressed", soundOn); snd.innerHTML = soundOn ? "🔊<span class=\"t\"> Sound on</span>" : "🔇<span class=\"t\"> Sound off</span>"; snd.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off"); }
syncSnd();
snd.onclick = () => {
  soundOn = !soundOn; syncSnd();
  try { localStorage.setItem("sb-sound", soundOn ? "on" : "off"); } catch(e) {}
  if (soundOn) { ensureAudio(); sfx.chime(); }
};
function ensureAudio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch(e) { AC = null; } }
document.addEventListener("pointerdown", () => { if (soundOn) ensureAudio(); }, {once:true});
function tone(f, d, type="square", vol=0.04, delay=0, slide=0){
  if (!soundOn || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  spawn(){ tone(180, .35, "sawtooth", .03, 0, 700); tone(880, .08, "square", .04, .33); },
  ding(){ tone(988, .18, "triangle", .07); tone(1319, .3, "triangle", .07, .12); },
  chime(){ [784, 988, 1175, 1568].forEach((f,i) => tone(f, .18, "triangle", .05, i*.07)); },
  buzz(){ tone(110, .4, "sawtooth", .05); tone(104, .4, "sawtooth", .05, .05); },
  type(){ for (let i = 0; i < 5; i++) tone(1800 + Math.random()*400, .025, "square", .015, i*.06); },
  think(){ tone(523, .2, "sine", .05); tone(659, .25, "sine", .05, .15); },
  bye(){ [523, 659, 784, 1047].forEach((f,i) => tone(f, .14, "square", .035, i*.09)); },
  idle(){ tone(392, .12, "triangle", .03); tone(330, .16, "triangle", .03, .1); }
};

/* ---------- world geometry ---------- */
let W = 448, H = 200, TW = 9, TH = 4, OX = W/2, OY = 46; const N = 24, X0 = -4.2;
const cam = {z:1, x:0, y:0};
let viewW = 448, viewH = 200, lastSky = "#1d2433";
const VW = () => viewW / cam.z, VH = () => viewH / cam.z;
function clampCam(){
  cam.z = Math.max(1, Math.min(4, cam.z));
  cam.x = VW() >= W ? (W - VW())/2 : Math.max(0, Math.min(W - VW(), cam.x));
  cam.y = VH() >= H ? (H - VH())/2 : Math.max(0, Math.min(H - VH(), cam.y));
}
function zoomAt(lx, ly, nz){ nz = Math.max(1, Math.min(4, nz)); const sx = (lx - cam.x)*cam.z, sy = (ly - cam.y)*cam.z; cam.z = nz; cam.x = lx - sx/nz; cam.y = ly - sy/nz; clampCam(); }
let camAnim = null;
function flyTo(z, lx, ly){ camAnim = {from:{...cam}, to:{z, x: lx - viewW/(2*z), y: ly - viewH/(2*z)}, t:0}; }
const iso = (gx, gy) => [OX + (gx - gy)*TW, OY + (gx + gy)*TH];
const ZONES = {
  spawn:     {r:[1,1,4.5,4.5],   floor:"#bfe3dc", edge:"#8cc7bb", label:"NEW HIRES"},
  planning:  {r:[6,1,12.5,7.5],  floor:"#ddd5ff", edge:"#a99be8", label:"PLANNING"},
